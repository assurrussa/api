name: Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Show revision and tools
        run: |
          git rev-parse HEAD
          go version
          docker version
      - name: Install pinned golangci-lint
        run: |
          api_lint_version=$(cat .golangci-lint-version)
          curl -fsSL "https://raw.githubusercontent.com/golangci/golangci-lint/v${api_lint_version}/install.sh" -o "$RUNNER_TEMP/golangci-lint-install.sh"
          sh "$RUNNER_TEMP/golangci-lint-install.sh" -b ./bin "v${api_lint_version}"
          bash scripts/lint.sh version
      - name: Full repository gate
        run: make check
      - name: Known reachable vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          "$(go env GOPATH)/bin/govulncheck" ./...

  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test . -run '^$' -fuzz '^FuzzTokenParser$' -fuzztime=1m
